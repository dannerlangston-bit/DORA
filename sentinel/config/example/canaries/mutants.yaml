# The one mutant catalog (4.11), in the {schema_version, entries} form of SD-47: ids M01 to M33, classes and
# money_cell flags of 12.5, seed 20260101. 12.5 is authoritative for ids, classes, seed and money_cell. Deviations of
# this example from the 12.5 rows, because the example registry holds eight of the 12.4 surfaces (the starter tree
# config/starter/canaries/mutants.yaml binds every row to its 12.5 checkpoint):
# - M10, M11, M13 to M19, M21, M24, M28, M30, M32 and M33 are bound to checkpoints of this example's own;
# - M13 and M14 assert R04 on the option chain census in 12.5 (strike count, expiration list); the example has no
#   option chain, so M13 asserts the R08 P/L math on the position statement read-back and M14 expects collateral on
#   the chart cell;
# - M25 binds s07 instead of checkpoint_id "*" (SD-43), since the simulated Nightly plans bound checkpoints only.
# M26 to M28 and M30 drive flow.canary.ticket-stock. The simulated app renders and scores every entry (pipeline.sim
# mutant_capture).
