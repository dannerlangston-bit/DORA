  - {host: slack.com, port: 443, purposes: [slack, digest]}
  - {host: scm.example.internal, port: 443, purposes: [pr_comment, preflight]}       # PR comments and commit status (9.2)
  - {host: sentinel-store.example.internal, port: 443, purposes: [preflight]}        # the Central Store (N7)
