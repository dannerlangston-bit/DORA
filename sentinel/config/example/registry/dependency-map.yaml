# Which surfaces consume which hosting primitive (4.4). Source packages are filled from the Phase 0
# jar listing (11.8); the 12.9 starter wrote them as TBD.<area>.** placeholders. The edges of the 12.4 surfaces this
# example holds are the 12.9 edges (FontMetrics and Theme global); the Flexible Grid cells charts.flexible-grid.*-cell
# are tier-2 surfaces with edges of this example's own. ChartEngine has no edge here and is left out.
schema_version: 1
primitives:
  - id: FlexibleGrid
    description: Grid container that hosts gadgets in resizable cells with splitters
    source_packages: ["com.tos.desktop.ui.grid.**"]
    owner: ui-platform
  - id: OrderTicketCore
    description: Order model, ticket fields, validation and the confirmation dialog
    source_packages: ["com.tos.desktop.trade.order.**"]
    owner: trade-ui
  - id: LadderModel
    description: Price ladder rows, centering and order bubbles of Active Trader
    source_packages: ["com.tos.desktop.trade.ladder.**"]
    owner: trade-ui
  - id: Theme
    description: Colors, borders and icon sets of the custom look and feel
    source_packages: ["com.tos.desktop.ui.laf.**"]
    owner: ui-platform
    global: true
  - id: FontMetrics
    description: Font set, sizes and text measurement for every text-bearing surface
    source_packages: ["com.tos.desktop.ui.text.**"]
    owner: ui-platform
    global: true
  - id: Docking
    description: Detach, dock and tab-host behavior for every movable panel
    source_packages: ["com.tos.desktop.ui.docking.**"]
    owner: ui-platform
  - id: ColumnModel
    description: Shared column layout, sorting and sizing for data grids
    source_packages: ["com.tos.desktop.ui.table.**"]
    owner: data-ui
  - id: SymbolLinking
    description: Link groups and symbol propagation between gadgets
    source_packages: ["com.tos.desktop.ui.linking.**"]
    owner: ui-platform
  - id: QuoteStream
    description: Quote subscription, flashing and value formatting for live cells
    source_packages: ["com.tos.desktop.data.quotes.**"]
    owner: data-ui
