# Order Confirmation (frozen). Money cells: Qty, Price, Buying Power Effect, Max Loss, Send, Cancel,
# Delete, each a zero-floor diff region asserted at s07 (L-RGN-04). The account number and the account
# holder name are identity fields: redacted in Capture by redaction/anchors.yaml, never a region (6.10).
schema_version: 1
checkpoint_id: flow/dialog.order-confirmation/flow.trade.order-ticket.stock.limit/s07
landmarks:
  - {id: lm.order-confirmation-title, template: regions/landmarks/lm.order-confirmation-title.png, confidence_min: 0.93}
regions:
  - {id: rgn.confirm.title, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 0, dy: 0, w: 200, h: 20}}
  - {id: rgn.confirm.side, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 24, dy: 48, w: 60, h: 20}}
  - {id: rgn.confirm.qty, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 90, dy: 48, w: 48, h: 20}, money_cell: true}
  - {id: rgn.confirm.symbol, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 144, dy: 48, w: 110, h: 20}}
  - {id: rgn.confirm.price, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 260, dy: 48, w: 90, h: 20}, money_cell: true}
  - {id: rgn.confirm.cost, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 24, dy: 96, w: 200, h: 20}}
  - {id: rgn.confirm.bp-effect, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 24, dy: 120, w: 200, h: 20}, money_cell: true}
  - {id: rgn.confirm.max-loss, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 24, dy: 144, w: 200, h: 20}, money_cell: true}
  - id: rgn.confirm.timestamp
    type: rule
    landmark: lm.order-confirmation-title
    panel: order_confirmation
    rect: {dx: 260, dy: 200, w: 110, h: 16}
    rule: {field: time, pattern: "^[0-9]{1,2}:[0-9]{2}:[0-9]{2}"}
  - {id: rgn.confirm.send-button, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 380, dy: 200, w: 90, h: 24}, money_cell: true}
  - {id: rgn.confirm.cancel-button, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 480, dy: 200, w: 90, h: 24}, money_cell: true}
  - {id: rgn.confirm.delete-button, type: diff, landmark: lm.order-confirmation-title, panel: order_confirmation, rect: {dx: 580, dy: 200, w: 90, h: 24}, money_cell: true}
