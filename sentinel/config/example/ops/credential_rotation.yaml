# The credential rotation calendar of 7.7 (4.16, SD-74): every login a rig uses, with its owner, backup owner and,
# under DR-03 branch B, the team-owned SMS device; each rotation's window, owner and the login-only canary run that
# validated it (6.9). A run scheduled inside a rotation window for its login is held, not started (sentinel.rotation).
# The second rotation is planned far ahead so the example stays valid on every date the tests and the demo use.
schema_version: 1
logins:
  - {login_ref: vault://sentinel/rigs/rig-01/tos-login, owner: asmith, backup_owner: fgupta, sms_device: team-phone-01}
rotations:
  - login_ref: vault://sentinel/rigs/rig-01/tos-login
    kind: password
    window: {start: "2026-10-17T22:00:00-04:00", end: "2026-10-17T23:30:00-04:00"}
    owner: asmith
    validating_run_id: run-2026-10-17-canary-login
  - login_ref: vault://sentinel/rigs/rig-01/tos-login
    kind: vault_token
    window: {start: "2030-01-19T22:00:00-05:00", end: "2030-01-19T23:00:00-05:00"}
    owner: asmith
